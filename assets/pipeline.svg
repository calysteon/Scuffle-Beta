<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" font-family="Helvetica,Arial,sans-serif">
  <rect width="1120" height="250" fill="#FFFFFF"/>

  <!-- input -->
  <rect x="16" y="86" width="150" height="78" rx="12" fill="#F0F3F6" stroke="#D5DCE3"/>
  <text x="91" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#14171C">stack trace</text>
  <text x="91" y="142" text-anchor="middle" font-size="11.5" fill="#6B7280" font-family="monospace">from a screenshot</text>

  <!-- stages -->
  <g>
    <rect x="198" y="80" width="150" height="90" rx="12" fill="#EAF3FB" stroke="#BBD8F2"/>
    <text x="273" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#0A4F97">Localize</text>
    <text x="273" y="134" text-anchor="middle" font-size="11" fill="#6B7280">deterministic</text>
    <text x="273" y="150" text-anchor="middle" font-size="10.5" fill="#8A94A0">trace &#8594; function</text>

    <rect x="378" y="80" width="150" height="90" rx="12" fill="#EAF3FB" stroke="#BBD8F2"/>
    <text x="453" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#0A4F97">Understand</text>
    <text x="453" y="134" text-anchor="middle" font-size="11" fill="#6B7280">small model</text>
    <text x="453" y="150" text-anchor="middle" font-size="10.5" fill="#8A94A0">the bug class</text>

    <rect x="558" y="80" width="150" height="90" rx="12" fill="#EAF3FB" stroke="#BBD8F2"/>
    <text x="633" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#0A4F97">Retrieve</text>
    <text x="633" y="134" text-anchor="middle" font-size="11" fill="#6B7280">knowledge base</text>
    <text x="633" y="150" text-anchor="middle" font-size="10.5" fill="#8A94A0">the wire format</text>

    <rect x="738" y="80" width="150" height="90" rx="12" fill="#EAF3FB" stroke="#BBD8F2"/>
    <text x="813" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#0A4F97">Value</text>
    <text x="813" y="134" text-anchor="middle" font-size="11" fill="#6B7280">deterministic solver</text>
    <text x="813" y="150" text-anchor="middle" font-size="10.5" fill="#8A94A0">the trigger value</text>
  </g>

  <!-- verify -->
  <rect x="918" y="80" width="150" height="90" rx="12" fill="#E7F6EF" stroke="#BFE6D3"/>
  <text x="993" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#0E8F5C">Verify</text>
  <text x="993" y="134" text-anchor="middle" font-size="11" fill="#6B7280">live crash oracle</text>
  <text x="993" y="150" text-anchor="middle" font-size="10.5" fill="#8A94A0">ground truth</text>

  <!-- arrows -->
  <g fill="#9AA1AB">
    <path d="M170 125 l16 0 m-6 -5 l6 5 l-6 5" stroke="#9AA1AB" stroke-width="2" fill="none"/>
    <path d="M350 125 l24 0 m-6 -5 l6 5 l-6 5" stroke="#9AA1AB" stroke-width="2" fill="none"/>
    <path d="M530 125 l24 0 m-6 -5 l6 5 l-6 5" stroke="#9AA1AB" stroke-width="2" fill="none"/>
    <path d="M710 125 l24 0 m-6 -5 l6 5 l-6 5" stroke="#9AA1AB" stroke-width="2" fill="none"/>
    <path d="M890 125 l24 0 m-6 -5 l6 5 l-6 5" stroke="#9AA1AB" stroke-width="2" fill="none"/>
  </g>

  <!-- caption -->
  <text x="560" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#14171C">A screenshot of a stack trace, turned into a proof of concept that reproduces the crash.</text>
  <text x="560" y="212" text-anchor="middle" font-size="12.5" fill="#6B7280">The model reads the bug; deterministic tools localize, retrieve, solve, and confirm. The live crash is the only success signal.</text>
</svg>
